# Creates the GitHub release for every pushed version tag (v1.2.0, v1.2.0-beta1 ...).
# The text is the matching section of CHANGELOG.md. Can also be run by hand for an existing tag:
# Actions -> Release -> Run workflow -> tag.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag, e.g. v1.1.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Release notes from the changelog
        run: |
          version="${TAG#v}"
          awk -v v="## $version" '$0 == v { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then echo "Pastime $version" > notes.md; fi
          printf '\nDownload: https://www.curseforge.com/wow/addons/pastime-in-flight-entertainment\n' >> notes.md
          cat notes.md

      # Same content as the CurseForge package: the folder "Pastime" without tests, media,
      # Markdown files and repository files; the TOC gets the tag as its version.
      - name: Build the addon zip
        run: |
          mkdir -p build/Pastime
          git ls-files | grep -Ev '^(tests/|media/|\.github/)|\.md$|^\.pkgmeta$|^\.gitignore$' | while IFS= read -r f; do
            mkdir -p "build/Pastime/$(dirname "$f")"
            cp "$f" "build/Pastime/$f"
          done
          sed -i "s/@project-version@/$TAG/" build/Pastime/Pastime.toc
          grep -q "^## Version: $TAG" build/Pastime/Pastime.toc
          (cd build && zip -qr "../Pastime-$TAG.zip" Pastime)
          unzip -l "Pastime-$TAG.zip" | tail -1

      - name: Create or update the release
        run: |
          flags=""
          case "$TAG" in *-*) flags="--prerelease" ;; esac
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --title "Pastime ${TAG#v}" --notes-file notes.md $flags
            gh release upload "$TAG" "Pastime-$TAG.zip" --clobber
          else
            gh release create "$TAG" "Pastime-$TAG.zip" --verify-tag --title "Pastime ${TAG#v}" --notes-file notes.md $flags
          fi
